name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py ai_service.py config.py session_store.py
      - name: Check imports
        run: python -c "import ai_service, config, session_store"
